# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "32-bit RISC-V (RV32I) microcontroller using TL-Verilog and Librelane-ORFS Flow"
  team: "A30 SILICON_RISC-V"
  discord: ""
  description: "The project aims to design and implement a basic 32-bit RISC-V processor compliant with the RV32I base instruction set. TL-Verilog (TLV) from Redwood EDA will be used to develop the RISC-V core. TLV's transaction-level modeling and timing abstraction will enable for faster development and better architectural insight."
  lvs_config: "lvs_config.json"

pins:
  - name: vss
    io_type: ground  # the first pin must be a ground connection -- chip ground, not a qspi_chip_top.sv port

  - name: reset
    io_type: input_cmos  # RTL: reset (input wire)  

  - name: clk
    io_type: input_schmitt  # RTL: clk (input wire)

  - name: uart_rx
    io_type: bidirectional  # RTL: uart_rx (input wire)

  - name: spi_miso
    io_type: bidirectional  # RTL: spi_miso (input wire) -- display-SPI peripheral input

  - name: spi_data0
    io_type: bidirectional_24ma  # RTL: spi_data_in[0] -> pad IN, spi_data_out[0] -> pad OUT, spi_data_oe[0] -> pad OE

  - name: spi_data1
    io_type: bidirectional_24ma  # RTL: spi_data_in[1] -> pad IN, spi_data_out[1] -> pad OUT, spi_data_oe[1] -> pad OE

  - name: spi_data2
    io_type: bidirectional_24ma  # RTL: spi_data_in[2] -> pad IN, spi_data_out[2] -> pad OUT, spi_data_oe[2] -> pad OE

  - name: spi_data3
    io_type: bidirectional_24ma  # RTL: spi_data_in[3] -> pad IN, spi_data_out[3] -> pad OUT, spi_data_oe[3] -> pad OE

  - name: spi_clk_out
    io_type: bidirectional_24ma  # RTL: spi_clk_out (output wire) -- QSPI flash/PSRAM clock

  - name: spi_flash_select
    io_type: bidirectional_24ma  # RTL: spi_flash_select (output wire)

  - name: spi_ram_a_select
    io_type: bidirectional_24ma  # RTL: spi_ram_a_select (output wire)

  - name: uart_tx
    io_type: bidirectional_24ma  # RTL: uart_tx (output wire)

  - name: spi_select
    io_type: bidirectional_24ma  # RTL: spi_select (output wire) -- display-SPI chip select

  - name: disp_spi_clk_out
    io_type: bidirectional_24ma  # RTL: disp_spi_clk_out (output wire) -- display-SPI clock

  - name: spi_mosi
    io_type: bidirectional_24ma  # RTL: spi_mosi (output wire) -- display-SPI data out

  - name: spi_dc
    io_type: bidirectional_24ma  # RTL: spi_dc (output wire) -- display-SPI data/command select

  - name: vdd
    io_type: power  # subsequent power/ground cells cause a break in the I/O power rails -- chip power, not a qspi_chip_top.sv port
